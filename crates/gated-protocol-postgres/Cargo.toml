[package]
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
name = "gated-protocol-postgres"
version = "0.0.2"

[dependencies]
gated-common = { version = "*", path = "../gated-common", default-features = false }
gated-tls = { version = "*", path = "../gated-tls", default-features = false }
gated-core = { version = "*", path = "../gated-core", default-features = false }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono = { version = "0.4", default-features = false, features = ["serde"] }
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
thiserror.workspace = true
pgwire = { version = "0.30", default-features = false, features = [
    "server-api-aws-lc-rs",
] }
rsasl = { version = "2.1.0", default-features = false, features = [
    "config_builder",
    "scram-sha-2",
    "std",
    "plain",
    "provider",
] }
futures.workspace = true
humantime = { version = "2.1", default-features = false }
socket2 = { version = "0.5", features = ["all"] }

[lints]
workspace = true
