[package]
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
name = "gated-common"
version = "0.21.1"

[[bin]]
name = "config-schema"
path = "src/config_schema.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.0", features = ["derive", "std"], default-features = false }
axum.workspace = true
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "rand"] }
bytes.workspace = true
chrono = { version = "0.4", default-features = false, features = ["serde"] }
data-encoding.workspace = true
delegate.workspace = true
futures.workspace = true
git-version = { version = "0.3.9", default-features = false }
governor.workspace = true
hyper = { version = "1.11", default-features = false }
hyper-util = { version = "0.1.20", default-features = false, features = ["http1", "http2", "server-auto", "server-graceful", "tokio"] }
humantime-serde = { version = "1.1", default-features = false }
password-hash.workspace = true
pastey = "0.2"
poem.workspace = true
poem-openapi.workspace = true
rand_chacha.workspace = true
rand.workspace = true
rcgen.workspace = true
reqwest.workspace = true
reqwest-websocket.workspace = true
russh.workspace = true
rustls.workspace = true
schemars.workspace = true
sea-orm.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2 = { version = "0.10", default-features = false }
socket2 = { version = "0.5", features = ["all"] }
subtle = { version = "2.6", default-features = false }
thiserror.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
tokio.workspace = true
tower-service = "0.3"
totp-rs = { version = "5.0", features = ["otpauth"], default-features = false }
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
url = { version = "2.2", default-features = false }
uuid.workspace = true
gated-ca = { version = "*", path = "../gated-ca", default-features = false }
gated-sso = { version = "*", path = "../gated-sso", default-features = false }
gated-tls = { version = "*", path = "../gated-tls", default-features = false }

[package.metadata.cargo-machete]
# humantime-serde: Referenced by serde with-attributes for duration fields.
# password-hash: Enables std support for the password-hash API re-exported by Argon2.
ignored = ["humantime-serde", "password-hash"]

[lints]
workspace = true
