[package]
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
name = "gated-admin"
version = "0.0.2"

[features]
sqlite = ["gated-core/sqlite", "sea-orm/sqlx-sqlite"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
chrono = { version = "0.4", default-features = false, features = ["serde"] }
cookie = "0.18"
data-encoding.workspace = true
futures.workspace = true
governor.workspace = true
hex = { workspace = true, features = ["alloc"] }
http = { version = "1.0", default-features = false }
metrics.workspace = true
percent-encoding = { version = "2.1", default-features = false }
portable-pty = "0.9"
rand.workspace = true
regex.workspace = true
russh.workspace = true
russh-sftp.workspace = true
rustls.workspace = true
sea-orm.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", default-features = false }
sqlx = { workspace = true, features = [
    "mysql",
    "postgres",
    "runtime-tokio",
    "chrono",
    "uuid",
    "json",
] }
tokio.workspace = true
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
url = { version = "2.2", default-features = false }
uuid.workspace = true
x509-parser.workspace = true
gated-ca = { version = "*", path = "../gated-ca" }
gated-common = { version = "*", path = "../gated-common" }
gated-tls = { version = "*", path = "../gated-tls" }
gated-core = { version = "*", path = "../gated-core" }
gated-db-entities = { version = "*", path = "../gated-db-entities" }
gated-protocol-http = { version = "*", path = "../gated-protocol-http" }
gated-protocol-ssh = { version = "*", path = "../gated-protocol-ssh" }
gated-sso = { version = "*", path = "../gated-sso" }
gated-web = { version = "*", path = "../gated-web" }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
rcgen.workspace = true

[lints]
workspace = true
