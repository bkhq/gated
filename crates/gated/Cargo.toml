[package]
edition = "2021"
license = "Apache-2.0"
name = "gated"
version = "0.21.1"

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.0", features = ["derive", "env"], default-features = false }
config = { version = "0.15", features = ["yaml"], default-features = false }
console = { version = "0.15", default-features = false }
console-subscriber = { version = "0.4", optional = true, default-features = false }
dialoguer.workspace = true
futures.workspace = true
metrics.workspace = true
notify = { version = "8.0", default-features = false, features = ["fsevent-sys"] }
poem.workspace = true
rcgen.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
serde_yaml = { version = "0.9", default-features = false }
sea-orm.workspace = true
time = { version = "0.3", default-features = false }
tokio.workspace = true
tracing.workspace = true
tracing-log = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = [
    "ansi",
    "env-filter",
    "json",
    "local-time",
], default-features = false }
tracing-appender = { version = "0.2", default-features = false }
tracing-opentelemetry = { version = "0.28", default-features = false, optional = true }
opentelemetry = { version = "0.27", default-features = false, features = [
    "trace",
], optional = true }
opentelemetry_sdk = { version = "0.27", default-features = false, features = [
    "trace",
    "rt-tokio",
], optional = true }
opentelemetry-otlp = { version = "0.27", default-features = false, features = [
    "trace",
    "grpc-tonic",
    "http-proto",
    "reqwest-client",
    "tls-roots",
], optional = true }
tonic = { version = "0.12", default-features = false, optional = true }
uuid = { version = "1.3", default-features = false }
gated-admin = { version = "*", path = "../gated-admin" }
gated-common = { version = "*", path = "../gated-common" }
gated-core = { version = "*", path = "../gated-core" }
gated-db-entities = { version = "*", path = "../gated-db-entities" }
gated-protocol-http = { version = "*", path = "../gated-protocol-http" }
gated-protocol-mysql = { version = "*", path = "../gated-protocol-mysql" }
gated-protocol-postgres = { version = "*", path = "../gated-protocol-postgres" }
gated-protocol-ssh = { version = "*", path = "../gated-protocol-ssh" }
gated-tls = { version = "*", path = "../gated-tls" }
secrecy.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = { version = "0.4", default-features = false }

[features]
default = ["sqlite", "otel"]
tokio-console = ["dep:console-subscriber", "tokio/tracing"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tonic",
]
postgres = ["gated-core/postgres"]
mysql = ["gated-core/mysql"]
sqlite = ["gated-core/sqlite"]

[package.metadata.cargo-machete]
# console-subscriber: Retains the existing optional tokio-console feature dependency for compatibility.
ignored = ["console-subscriber"]
