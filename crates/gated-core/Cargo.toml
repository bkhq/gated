[package]
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
name = "gated-core"
version = "0.0.2"

[dependencies]
gated-ca = { version = "*", path = "../gated-ca" }
gated-common = { version = "*", path = "../gated-common" }
gated-db-entities = { version = "*", path = "../gated-db-entities" }
gated-db-migrations = { version = "*", path = "../gated-db-migrations" }
gated-tls = { version = "*", path = "../gated-tls" }
sea-orm-migration.workspace = true

anyhow.workspace = true
arc-swap.workspace = true
argon2.workspace = true
base64ct.workspace = true
bytes.workspace = true
chacha20poly1305.workspace = true
chrono = { version = "0.4", default-features = false, features = ["serde"] }
data-encoding.workspace = true
enum_dispatch.workspace = true
futures.workspace = true
hex.workspace = true
libsqlite3-sys.workspace = true
packet = "0.1"
password-hash.workspace = true
axum.workspace = true
utoipa.workspace = true
rand.workspace = true
regex.workspace = true
rand_core.workspace = true
sea-orm.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", default-features = false }
subtle = "2.6"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-core = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
url = { version = "2.2", default-features = false }
uuid.workspace = true
gated-sso = { version = "*", path = "../gated-sso", default-features = false }
governor.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
sqlx = { workspace = true, features = [
    "mysql",
    "postgres",
    "runtime-tokio",
] }
x509-parser.workspace = true
zeroize.workspace = true

[features]
postgres = ["sea-orm/sqlx-postgres", "gated-db-migrations/postgres"]
mysql = ["sea-orm/sqlx-mysql", "gated-db-migrations/mysql"]
sqlite = ["sea-orm/sqlx-sqlite", "gated-db-migrations/sqlite"]

[package.metadata.cargo-machete]
# libsqlite3-sys: Enables bundled SQLCipher and vendored OpenSSL for SQLx through Cargo feature unification.
ignored = ["libsqlite3-sys"]

[lints]
workspace = true
