[package]
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
name = "gated-protocol-http"
version = "0.0.2"

[dependencies]
anyhow.workspace = true
base64 = { version = "0.22", default-features = false }
bytes.workspace = true
chrono = { version = "0.4", default-features = false, features = ["serde"] }
futures.workspace = true
http = { version = "1.0", default-features = false }
axum.workspace = true
utoipa.workspace = true
regex.workspace = true
reqwest.workspace = true
reqwest-websocket.workspace = true
rustls.workspace = true
sea-orm.workspace = true
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false }
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url = { version = "2.0", default-features = false }
urlencoding = "2"
uuid.workspace = true
x509-parser.workspace = true
gated-ca = { version = "*", path = "../gated-ca", default-features = false }
gated-common = { version = "*", path = "../gated-common", default-features = false }
gated-tls = { version = "*", path = "../gated-tls", default-features = false }
gated-core = { version = "*", path = "../gated-core", default-features = false }
gated-db-entities = { version = "*", path = "../gated-db-entities", default-features = false }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
