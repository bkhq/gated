services:
  gated:
    image: ghcr.io/bkhq/gated
    # Published ports bind to loopback (127.0.0.1) only, so the admin HTTP API
    # and protocol listeners are NOT exposed to the LAN/Internet by default
    # (8888 serves the setup/admin surface pre-setup). To expose a port
    # publicly, drop its "127.0.0.1:" prefix — ideally only behind a
    # TLS-terminating reverse proxy.
    #
    # Port set matches the listeners the Docker setup path enables
    # (see crates/gated/src/commands/setup.rs: is_docker() turns on
    # admin/SSH/MySQL/PostgreSQL/HTTP proxy). Starting on an empty ./data
    # without setup enables admin, SSH and the HTTP proxy (GATED_ENCRYPTION=true
    # adds at-rest encryption) and prints a one-time bootstrap token; create
    # the first admin account with it in the admin UI.
    ports:
      - 127.0.0.1:8888:8888    # HTTP admin API + setup surface
      - 127.0.0.1:2222:2222    # SSH
      - 127.0.0.1:33306:33306  # MySQL
      - 127.0.0.1:55432:55432  # PostgreSQL
      - 127.0.0.1:8443:8443    # HTTP proxy (incl. Kubernetes targets)
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true
