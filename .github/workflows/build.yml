name: Build
permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64-linux
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04 # older image for glibc compatibility
            cyclonedx-build: cyclonedx-linux-x64
            cyclonedx-sha256: 5e1595542a6367378a3944bbd3008caab3de65d572345361d3b9597b1dbbaaa0
          - arch: arm64-linux
            target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm # older image for glibc compatibility
            cyclonedx-build: cyclonedx-linux-arm64
            cyclonedx-sha256: 5b4181f6fd4d8fbe54e55c1b3983d9af66ce2910a263814b290cbd5e351e68a4
      fail-fast: false

    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    # Build/test only: no contents/id-token/attestations write. Publishing and
    # attestation are scoped to the separate `release` job below.
    permissions:
      contents: read
      artifact-metadata: write

    steps:
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt update
          sudo apt install -y libssl-dev pkg-config

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: rlespinasse/github-slug-action@9e7def61550737ba68c62d34a32dd31792e3f429

      - name: Cache Rust
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-build-

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Cache cargo tools
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-tools-just-cargo-deny-0.18.9-cargo-cyclonedx-0.5

      - name: Install tools
        run: |
          command -v just || cargo install --locked just
          command -v cargo-deny || cargo install --locked cargo-deny@0.18.9
          command -v cargo-cyclonedx || cargo install --locked cargo-cyclonedx@^0.5
          rm -rf ~/.cargo/registry

      - name: Install CycloneDX
        run: |
          mkdir cdx
          wget -q https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.27.2/${{ matrix.cyclonedx-build }} -O cyclonedx
          echo "${{ matrix.cyclonedx-sha256 }}  cyclonedx" | sha256sum -c -
          chmod +x cyclonedx

      - name: Install CycloneDX-bun
        run: |
          bun i -g @cyclonedx/cdxgen@12.6.0

      - name: cargo-deny
        run: |
          cargo deny --version
          cargo deny check

      - name: Install UI deps
        run: |
          just bun install --frozen-lockfile

      - name: Build UI
        run: |
          just bun run build

      - name: Generate UI BOM
        run: |
          cd web && cdxgen -t bun -o ../cdx/admin-ui.cdx.json --spec-version 1.5
          cd ..
          ./cyclonedx convert --input-file cdx/admin-ui.cdx.json --output-file cdx/admin-ui.cdx.xml --input-format json --output-format xml
          rm cdx/admin-ui.cdx.json

      - name: Build
        env:
          SOURCE_DATE_EPOCH: "0" # for rust-embed determinism
        run: |
          # Expanded by the shell: cargo does not expand variables in rustflags.
          RUSTFLAGS="--cfg tokio_unstable --remap-path-prefix=$HOME=/reproducible-home --remap-path-prefix=$PWD=/reproducible-pwd" \
            cargo build --locked --all-features --release --target ${{ matrix.target }}

      - name: Generate Rust BOM
        run: |
          cargo cyclonedx --all-features
          mv crates/gated*/*.cdx.xml cdx/

      - name: Merge BOMs
        run: ./cyclonedx merge --input-files cdx/* --input-format xml --output-format xml > cdx.xml

      - name: Upload artifact
        uses: actions/upload-artifact@2848b2cda0e5190984587ec6bb1f36730ca78d50
        with:
          name: gated-${{ env.GITHUB_REF_SLUG }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/gated

      - name: Upload SBOM
        uses: actions/upload-artifact@2848b2cda0e5190984587ec6bb1f36730ca78d50
        with:
          name: gated-${{ env.GITHUB_REF_SLUG }}-${{ matrix.arch }}.cdx.xml
          path: cdx.xml

  # Publish/attest only. Elevated write permissions live here, not in the
  # build matrix job (which is restricted to contents: read).
  release:
    name: Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: read

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts

      - name: Attest build
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: artifacts/gated-*/gated

      - name: Assemble release assets
        run: |
          mkdir dist
          for dir in artifacts/gated-*; do
            name=$(basename "$dir")
            if [ -f "$dir/gated" ]; then
              # Stable-named archive for lode, which selects assets by filename.
              case "$name" in
                *-x86_64-linux) lode_name=gated-linux-x64.tar.gz ;;
                *-arm64-linux) lode_name=gated-linux-arm64.tar.gz ;;
                *) echo "unknown arch in $name"; exit 1 ;;
              esac
              chmod +x "$dir/gated"
              tar czf "dist/$lode_name" -C "$dir" gated
              mv "$dir/gated" "dist/$name"
            elif [ -f "$dir/cdx.xml" ]; then
              mv "$dir/cdx.xml" "dist/$name"
            fi
          done

      - name: Sign lode archives
        env:
          LODE_SIGNING_KEY: ${{ secrets.LODE_SIGNING_KEY }}
          LODE_CLI_SHA256: b25e2340cdafd4b04fd2974cafa3ce723cbacbf5d32ebd3d75c9f6de5c141910
        run: |
          set -euo pipefail
          if [ -z "${LODE_SIGNING_KEY:-}" ]; then
            echo "::warning::LODE_SIGNING_KEY not set; lode archives are uploaded unsigned"
            exit 0
          fi
          curl -fsSL -o lode.tar.gz https://github.com/bkhq/lode/releases/download/v0.4.0/lode-linux-x64.tar.gz
          echo "$LODE_CLI_SHA256  lode.tar.gz" | sha256sum -c -
          mkdir lode && tar xzf lode.tar.gz -C lode
          for f in dist/gated-linux-*.tar.gz; do
            lode/lode-cli sign "$f" --app gated --version "${GITHUB_REF_NAME#v}" --key-env LODE_SIGNING_KEY \
              | awk '/^sig:/ {print $2}' > "$f.sig"
            test -s "$f.sig"
          done

      - name: Upload release
        uses: softprops/action-gh-release@1853d73993c8ca1b2c9c1a7fede39682d0ab5c2a
        with:
          draft: false
          generate_release_notes: true
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}

  config-schema:
    name: Config schema check
    runs-on: ubuntu-24.04

    steps:
      - name: Setup
        run: |
          sudo apt update
          sudo apt install --no-install-recommends -y libssl-dev pkg-config

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Cache Rust
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-schema-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-schema-

      - name: Cache cargo tools
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-tools-just

      - name: Install tools
        run: |
          command -v just || cargo install --locked just

      - name: Ensure there are no changes in config schema
        run: |
          mkdir -p web/dist
          just config-schema
          git diff --exit-code config-schema.json
