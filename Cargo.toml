# cargo-features = ["profile-rustflags"]

[workspace]
members = ["crates/*"]
default-members = ["crates/gated"]
resolver = "2"
exclude = ["vendor/poem", "vendor/poem-openapi"]

[workspace.package]
edition = "2021"
rust-version = "1.95"

[workspace.lints.rust]
warnings = { level = "deny", priority = -2 }
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
result_large_err = "allow"

[patch.crates-io]
# Remove when Poem releases support for quick-xml >= 0.41 (see docs/decisions).
poem = { path = "vendor/poem" }
poem-openapi = { path = "vendor/poem-openapi" }

[workspace.dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
argon2 = "0.5"
base64ct = "1.6"
bytes = { version = "1.4", default-features = false }
chacha20poly1305 = "0.10"
data-encoding = { version = "2.3", default-features = false, features = ["alloc", "std"] }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0", default-features = false }
russh = { version = "0.63.3", features = ["des", "rsa", "aws-lc-rs"], default-features = false }
futures = { version = "0.3", default-features = false }
tokio-stream = { version = "0.1.17", features = ["net"], default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
enum_dispatch = { version = "0.3.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["tls12"] }
sqlx = { version = "0.8", features = ["tls-rustls-aws-lc-rs"], default-features = false }
sea-orm = { version = "1.0", default-features = false, features = ["runtime-tokio", "macros"] }
sea-orm-migration = { version = "1.0", default-features = false, features = [
    "cli",
] }
poem = { version = "3.1", features = [
    "cookie",
    "session",
    "anyhow",
    "websocket",
    "rustls",
    "embed",
    "server",
], default-features = false }
hex = { version = "0.4", default-features = false }
libsqlite3-sys = { version = "=0.30.1", default-features = false, features = [
    "bundled-sqlcipher-vendored-openssl",
    "min_sqlite_version_3_14_0",
] }
poem-openapi = { version = "5.1", features = [
    "stoplight-elements",
    "chrono",
    "uuid",
    "static-files",
    "cookie",
], default-features = false }
password-hash = { version = "0.5", features = ["std"], default-features = false }
delegate = { version = "0.13", default-features = false }
tracing = { version = "0.1", default-features = false }
schemars = { version = "0.9.0", default-features = false, features = ["derive", "std"] }
rustls-pki-types = { version = "1.13", default-features = false, features = ["alloc", "std"] }
thiserror = { version = "2", default-features = false }
zeroize = { version = "1.8", features = ["derive"] }
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", features = ["std"], default-features = false }
secrecy = { version = "0.10", features = ["serde"] }
dialoguer = { version = "0.11", default-features = false, features = ["editor", "password"] }
tokio = { version = "1.20", features = ["tracing", "signal", "macros", "rt-multi-thread", "io-util"], default-features = false }
governor = { version = "0.10.0", default-features = false, features = ["std", "quanta", "jitter"] }
rcgen = { version = "0.13", features = ["zeroize", "crypto", "aws_lc_rs", "pem", "x509-parser"], default-features = false }
x509-parser = "0.17.0"
uuid = { version = "1.3", features = ["v4", "serde"], default-features = false }
reqwest = { version = "0.13", features = [
    "http2",                               # required for connecting to targets behind AWS ELB
    "rustls-no-provider",
    "stream",
    "gzip",
], default-features = false }
reqwest_12 = { package = "reqwest", version = "0.12", features = [
    "http2",
    "rustls-tls-native-roots-no-provider",
    "stream",
    "gzip",
], default-features = false } # separate copy to control features on openidconnect->oauth2->reqwest
regex = { version = "1.6", default-features = false, features = ["std"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots", "connect"], default-features = false }
reqwest-websocket = "0.6.0"
arc-swap = { version = "1.7", default-features = false }
metrics = { version = "0.24", default-features = false }
# `metrics-exporter-prometheus` defaults pull in a full hyper-based HTTP
# listener + a push-gateway client + UDS support. We only need the
# PrometheusHandle render path — we spawn our own poem listener in
# `run.rs` so graceful shutdown is tied to the main future set.
metrics-exporter-prometheus = { version = "0.17", default-features = false }

[profile.release]
# LTO is disabled because Rust 1.95 + musl + full LTO + aws-lc-sys corrupts
# TLS setup and causes an early-startup SIGSEGV right after `ARCH_SET_FS`.
# Dropping to no-LTO keeps the static-PIE musl binary bootable at the cost of
# a small size/speed regression that `strip` mostly absorbs.
lto = false
panic = "abort"
strip = "debuginfo"

# Dev + test builds link in lots of crates at once; with musl + full DWARF +
# aws-lc-sys/ring/zstd/sqlite3 the single `ld` invocation peaks past 10 GiB RSS
# and on a 16 GiB machine without swap gets OOM-killed. Keep line tables only so
# panics still show readable backtraces without blowing up the linker.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.coverage]
inherits = "dev"
# rustflags = ["-Cinstrument-coverage"]
