events {}
http {
    server {
        listen 8443 ssl;
        server_name k8s-cert-upstream;

        ssl_certificate     /etc/ssl/srv.crt;
        ssl_certificate_key /etc/ssl/srv.key;

        ssl_client_certificate /etc/ssl/ca.crt;
        ssl_verify_client on;

        location / {
            add_header Content-Type text/plain always;
            return 200 "client_subject=$ssl_client_s_dn\nclient_verify=$ssl_client_verify\n";
        }
    }
}
