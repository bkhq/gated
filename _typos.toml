[files]
extend-exclude = [
    "*.lock",
    "*.snapshot.json",
    "web/src/shared/lib/api/",
    "tests/certs/",
    "tests/ssh-keys/",
    # Vendored upstream sources; not ours to spell-check.
    "third/",
]

[default]
# Base64 SSH host-key fingerprints.
extend-ignore-re = ["SHA256:[A-Za-z0-9+/]{43}"]

[default.extend-words]
# CVE Numbering Authority
CNA = "CNA"
unparseable = "unparseable"

[default.extend-identifiers]
# The `flate2` crate.
flate2 = "flate2"
# Field of `vnc-rs`' pointer event, spelled this way upstream.
bottons = "bottons"
